# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-orangepi4a"
BBFILE_PATTERN_meta-orangepi4a = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-orangepi4a = "6"

LAYERDEPENDS_meta-orangepi4a = "core"
LAYERSERIES_COMPAT_meta-orangepi4a = "wrynose"
